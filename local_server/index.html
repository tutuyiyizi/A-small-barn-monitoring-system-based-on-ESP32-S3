<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>谷仓监测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6ef;color:#223d2c;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:28px;margin:0}h2{font-size:19px;margin:0 0 16px}.muted{color:#667465;font-size:14px}.badge{background:#e1e7df;padding:10px 16px;border-radius:20px}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card,section{background:white;border:1px solid #dce2d7;border-radius:14px;padding:20px}.value{font-size:30px;margin-top:10px}section{margin-top:18px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button{background:#28583c;color:white;border:0;border-radius:7px;padding:10px 17px;font-size:15px;cursor:pointer}button:disabled{opacity:.4;cursor:default}input{width:90px;padding:9px;border:1px solid #c3cebf;border-radius:6px}label{display:inline-flex;gap:8px;align-items:center;margin:8px 12px 8px 0}canvas{width:100%;height:180px;display:block}.plots{display:grid;grid-template-columns:1fr 1fr;gap:18px}.warn{color:#ad3e23}#message{min-height:24px}.small{font-size:13px}@media(max-width:650px){#cards,.plots{grid-template-columns:1fr 1fr}header{align-items:start;flex-direction:column}.plots{grid-template-columns:1fr}.value{font-size:25px}}
</style></head><body><main>
<header><div><h1>谷仓环境监测</h1><p class="muted">本地 Wi-Fi · 实时采集与异常报警</p></div><span id="status" class="badge">等待设备数据</span></header>
<p id="device" class="muted"></p><div id="cards"></div>
<section><h2>设备状态</h2><p id="state">尚无数据，请确认 ESP32 与 Broker 已连接。</p><p id="alarms" class="warn"></p><p id="freshness" class="muted"></p></section>
<section><h2>报警阈值</h2><p class="muted">仓湿或粮温超过报警阈值时触发声光报警；降到解除阈值后停止。</p>
<form id="settings"><label>湿度报警<input name="humidity_on" type="number" min="0" max="100" step="0.1" value="65" required> %</label><label>湿度解除<input name="humidity_off" type="number" min="0" max="100" step="0.1" value="60" required> %</label><br><label>粮温报警<input name="grain_on" type="number" min="-20" max="60" step="0.1" value="30" required> °C</label><label>粮温解除<input name="grain_off" type="number" min="-20" max="60" step="0.1" value="28" required> °C</label><button class="control" type="submit">应用阈值</button></form>
<p id="message" class="muted" aria-live="polite"></p></section>
<section><h2>最近一小时</h2><div class="plots"><div>仓温 / 粮温（°C）<canvas id="temperature"></canvas></div><div>仓湿（%RH）<canvas id="humidity"></canvas></div><div>TVOC（ppb）<canvas id="tvoc"></canvas></div><div>光照（lx）<canvas id="light"></canvas></div></div><p class="muted">仓温：绿色；粮温：橙色。横轴为本地接收时间。无数据时不绘制曲线。</p></section>
<p class="muted small">eCO₂ 是估算空气质量指标。阈值用于原型演示；页面设置在设备重启后恢复默认。历史保留24小时，门磁统计从设备本次启动计算。</p>
</main><script>
// 仪表盘只读取本机 Python 服务；页面不直接连接 Broker，也不保存 MQTT 密码。
const fields=[['air_c','仓内温度','°C'],['humidity_pct','仓内湿度','%RH'],['grain_c','粮堆温度','°C'],['tvoc_ppb','TVOC','ppb'],['eco2_ppm','eCO₂（估算）','ppm'],['lux','仓内光照','lx']];
const cards=document.getElementById('cards');
for(const [key,label,unit] of fields){const card=document.createElement('div');card.className='card';const name=document.createElement('div');name.textContent=label;const value=document.createElement('div');value.className='value';value.id=key;value.textContent='-- '+unit;card.append(name,value);cards.append(card)}
let historyRows=[], initializedSession='', online=false;
const text=(id,value)=>document.getElementById(id).textContent=value;
const number=v=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(1):'--';
function enableControls(ok){online=ok;document.querySelectorAll('.control').forEach(b=>b.disabled=!ok)}enableControls(false);
// 每次刷新依照接收端的 online 判断控制是否可用；缺测数值显示为 --。
async function refresh(){try{const response=await fetch('/api/current');if(!response.ok)throw Error();const r=await response.json();enableControls(r.online);text('status',r.online?'设备在线':r.mqtt_connected?'等待设备新数据':'接收端未连接 Broker');if(!r.data)return;const d=r.data;text('device',d.device==='test-granary'?'当前为模拟测试数据，未连接实物':'设备：'+d.device);for(const [key,,unit]of fields)text(key,number(d.sensors[key])+' '+unit);const door=d.door||{};text('state',`仓门：${door.open?'打开':'关闭'} · 开门 ${door.count??0} 次 · 光照确认 ${door.lit_count??0} 次 · 当前开门 ${door.open_s??0}s · 最长 ${door.longest_s??0}s`);const alarms=[];if(d.grain_hot)alarms.push('粮温偏高');if(d.humidity_high)alarms.push('仓湿偏高');if(d.grain_delta)alarms.push('粮温持续异常升高');if(d.tvoc_trend)alarms.push('TVOC趋势异常');if(d.door_timeout)alarms.push('仓门未关闭');if(d.sensor_fault_bits)alarms.push('传感器故障位：'+d.sensor_fault_bits);if(d.gas_warming)alarms.push('气体传感器尚未就绪');text('alarms',alarms.join('；'));text('freshness',`距上次收到数据 ${Math.round(r.age_s)} 秒${r.online?'':'，以下读数可能已过期'}`);if(d.session!==initializedSession&&d.thresholds){for(const [k,v]of Object.entries(d.thresholds)){if(document.forms.settings.elements[k])document.forms.settings.elements[k].value=v}initializedSession=d.session}if(r.ack?.accepted===false)text('message','设备拒绝命令：'+r.ack.reason)}catch{enableControls(false);text('status','本地接收程序连接中断')}}
// 命令只向本机 HTTP 接口发送，服务端验证阈值并补入设备当前会话令牌。
async function send(command){if(!online)return;try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)});const result=await r.json();if(!r.ok)throw Error(result.error);text('message','命令已发送，请以设备随后上报的实际状态为准。')}catch(e){text('message',e.message)}}
document.getElementById('settings').onsubmit=e=>{e.preventDefault();const thresholds={};for(const[k,v]of new FormData(e.target))thresholds[k]=Number(v);send({thresholds})};
// 曲线只使用最近一小时有限数值；相邻样本间隔超过 15 秒时断开线条。
function plot(id,keys){const c=document.getElementById(id),ctx=c.getContext('2d'),w=c.clientWidth,h=180,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const points=historyRows.flatMap(r=>keys.map(k=>r[k])).filter(v=>typeof v==='number'&&Number.isFinite(v));ctx.font='11px system-ui';ctx.fillStyle='#687365';if(!points.length){ctx.fillText('等待历史数据',25,80);return}let low=Math.min(...points),high=Math.max(...points);if(high-low<1){low-=.5;high+=.5}const left=45,right=w-10,top=16,bottom=150,end=Date.now()/1000,start=end-3600;ctx.strokeStyle='#e3e8df';for(let i=0;i<=3;i++){const y=top+(bottom-top)*i/3;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillText((high-(high-low)*i/3).toFixed(1),0,y+3)}ctx.fillText(new Date(start*1000).toLocaleTimeString(),left,174);ctx.fillText(new Date(end*1000).toLocaleTimeString(),Math.max(left,right-66),174);keys.forEach((key,i)=>{ctx.strokeStyle=i?'#bf6a37':'#367a52';ctx.lineWidth=2;ctx.beginPath();let last=null;for(const row of historyRows){const v=row[key];if(typeof v!=='number'||!Number.isFinite(v)){last=null;continue}const x=left+(row.time-start)/3600*(right-left),y=bottom-(v-low)/(high-low)*(bottom-top);if(last===null||row.time-last>15)ctx.moveTo(x,y);else ctx.lineTo(x,y);last=row.time}ctx.stroke()})}
function draw(){plot('temperature',['air_c','grain_c']);plot('humidity',['humidity_pct']);plot('tvoc',['tvoc_ppb']);plot('light',['lux'])}
async function loadHistory(){try{const r=await fetch('/api/history');if(r.ok){historyRows=await r.json();draw()}}catch{}}
refresh();loadHistory();setInterval(refresh,2000);setInterval(loadHistory,10000);window.addEventListener('resize',draw);
</script></body></html>
